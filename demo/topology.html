<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Behavioral Baseline — Live Topology</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0D1117;
    color: #E6EDF3;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Header ── */
  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: #161B22;
    border-bottom: 1px solid #21262D;
    flex-shrink: 0;
  }
  #header h1 {
    font-size: 15px;
    font-weight: 600;
    color: #00BCEB;
    letter-spacing: 0.04em;
  }
  #header .meta {
    font-size: 11px;
    color: #8B949E;
  }
  #status-badge {
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    transition: all 0.3s;
  }
  .status-ok      { background: #1C3A2A; color: #3FB950; border: 1px solid #238636; }
  .status-warning { background: #3A2A1C; color: #D29922; border: 1px solid #9E6A03; }
  .status-error   { background: #3A1C1C; color: #F85149; border: 1px solid #8B2020; }

  /* ── Main layout ── */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Graph canvas ── */
  #graph-container {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  svg {
    width: 100%;
    height: 100%;
  }

  /* Node circles */
  .node circle {
    stroke-width: 2;
    cursor: pointer;
    transition: filter 0.2s;
  }
  .node circle:hover { filter: brightness(1.3); }
  .node text {
    font-size: 11px;
    fill: #E6EDF3;
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
    font-weight: 500;
  }
  .node .label-bg {
    fill: rgba(13,17,23,0.75);
    rx: 3;
  }

  /* Node states */
  .node-healthy  circle { fill: #1C3A2A; stroke: #3FB950; }
  .node-drift    circle { fill: #3A2E1C; stroke: #D29922; }
  .node-error    circle { fill: #3A1C1C; stroke: #F85149; }
  .node-missing  circle { fill: #1C1C2A; stroke: #58A6FF; stroke-dasharray: 5 3; }
  .node-rootcause circle {
    fill: #1C1040;
    stroke: #BF5AF2;
    stroke-width: 3;
    filter: drop-shadow(0 0 8px #BF5AF2);
  }
  /* New/unknown node — appeared in a drift event, not in baseline */
  .node-new circle {
    fill: #1A1A2E;
    stroke: #D29922;
    stroke-width: 2;
    stroke-dasharray: 4 3;
    filter: drop-shadow(0 0 6px rgba(210,153,34,0.5));
  }
  .node-new .pulse-ring { stroke: #D29922; animation: pulse 2s infinite; }
  /* New edge — discovered via drift */
  .link-new {
    stroke: #D29922;
    stroke-opacity: 0.85;
    stroke-width: 1.5;
    stroke-dasharray: 6 3;
    fill: none;
    marker-end: url(#arrow-new);
  }

  /* Pulse ring on anomalous nodes */
  .pulse-ring {
    fill: none;
    stroke-width: 1.5;
    opacity: 0;
  }
  .node-drift  .pulse-ring { stroke: #D29922; animation: pulse 1.8s infinite; }
  .node-error  .pulse-ring { stroke: #F85149; animation: pulse 1.2s infinite; }
  .node-missing .pulse-ring { stroke: #58A6FF; animation: pulse 2.5s infinite; }
  .node-rootcause .pulse-ring { stroke: #BF5AF2; animation: pulse 1.0s infinite; }

  @keyframes pulse {
    0%   { opacity: 0.8; r: 0; }
    100% { opacity: 0;   r: 28px; }
  }

  /* Edges */
  .link {
    stroke: #4A5568;
    stroke-opacity: 0.85;
    stroke-width: 1.5;
    fill: none;
    marker-end: url(#arrow-normal);
    transition: stroke 0.3s, stroke-opacity 0.3s, stroke-width 0.3s;
  }
  .link:hover {
    stroke: #8B949E;
    stroke-opacity: 1;
    stroke-width: 2;
    cursor: pointer;
  }
  .link-affected {
    stroke: #F85149;
    stroke-opacity: 0.95;
    stroke-width: 2.5;
    filter: drop-shadow(0 0 3px rgba(248,81,73,0.4));
    marker-end: url(#arrow-affected);
  }
  .link-chain {
    stroke: #BF5AF2;
    stroke-opacity: 0.95;
    stroke-width: 2;
    stroke-dasharray: 6 3;
    filter: drop-shadow(0 0 3px rgba(191,90,242,0.4));
    marker-end: url(#arrow-chain);
  }

  /* ── Side panel ── */
  #panel {
    width: 320px;
    background: #161B22;
    border-left: 1px solid #21262D;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }
  #panel-header {
    padding: 12px 16px;
    border-bottom: 1px solid #21262D;
    font-size: 11px;
    color: #8B949E;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  #panel-content {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }
  #panel-content::-webkit-scrollbar { width: 4px; }
  #panel-content::-webkit-scrollbar-track { background: #161B22; }
  #panel-content::-webkit-scrollbar-thumb { background: #30363D; border-radius: 2px; }

  .panel-section {
    margin-bottom: 16px;
  }
  .panel-section h3 {
    font-size: 11px;
    color: #8B949E;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-bottom: 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid #21262D;
  }

  .service-card {
    background: #0D1117;
    border: 1px solid #21262D;
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .service-card .svc-name {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .service-card.state-error   .svc-name { color: #F85149; }
  .service-card.state-drift   .svc-name { color: #D29922; }
  .service-card.state-missing .svc-name { color: #58A6FF; }
  .service-card.state-rootcause .svc-name { color: #BF5AF2; }

  .badge {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 600;
    margin-right: 4px;
    margin-bottom: 4px;
    letter-spacing: 0.04em;
  }
  .badge-error    { background: #3A1C1C; color: #F85149; border: 1px solid #8B2020; }
  .badge-drift    { background: #3A2E1C; color: #D29922; border: 1px solid #9E6A03; }
  .badge-missing  { background: #1C1C2A; color: #58A6FF; border: 1px solid #1F6FEB; }
  .badge-rootcause{ background: #1C1040; color: #BF5AF2; border: 1px solid #7F3FBF; }

  .anomaly-item {
    font-size: 11px;
    color: #8B949E;
    margin-top: 4px;
    line-height: 1.5;
    word-break: break-word;
  }
  .anomaly-item .ts {
    color: #484F58;
    font-size: 10px;
  }

  /* Causality chain */
  .chain-container {
    background: #0D1117;
    border: 1px solid #30194A;
    border-radius: 6px;
    padding: 10px 12px;
  }
  .chain-item {
    display: flex;
    align-items: center;
    padding: 3px 0;
    font-size: 12px;
  }
  .chain-arrow {
    color: #484F58;
    margin: 0 6px;
    font-size: 10px;
  }
  .chain-svc { color: #E6EDF3; }
  .chain-root {
    color: #BF5AF2;
    font-weight: 700;
  }
  .chain-root::after {
    content: ' ★';
    font-size: 10px;
  }
  .chain-label {
    font-size: 10px;
    color: #BF5AF2;
    margin-left: 6px;
  }

  /* Event log */
  #event-log {
    border-top: 1px solid #21262D;
    height: 160px;
    overflow-y: auto;
    padding: 8px 12px;
    flex-shrink: 0;
  }
  #event-log::-webkit-scrollbar { width: 4px; }
  #event-log::-webkit-scrollbar-thumb { background: #30363D; border-radius: 2px; }
  .log-header {
    font-size: 10px;
    color: #484F58;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-bottom: 6px;
  }
  .log-entry {
    font-size: 10px;
    line-height: 1.6;
    border-bottom: 1px solid #161B22;
    padding: 3px 0;
  }
  .log-entry .log-ts   { color: #484F58; }
  .log-entry .log-type-error   { color: #F85149; }
  .log-entry .log-type-drift   { color: #D29922; }
  .log-entry .log-type-missing { color: #58A6FF; }
  .log-entry .log-svc  { color: #E6EDF3; }

  /* Buttons */
  .btn {
    background: none;
    border: 1px solid #30363D;
    color: #8B949E;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    font-family: inherit;
    transition: all 0.2s;
  }
  .btn:hover { border-color: #58A6FF; color: #58A6FF; }
  #btn-clear { }

  /* Demo scenario bar */
  #demo-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 20px;
    background: #0D1117;
    border-top: 1px solid #21262D;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  #demo-bar .demo-label {
    font-size: 10px;
    color: #484F58;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-right: 4px;
  }
  .btn-scenario {
    background: #161B22;
    border: 1px solid #30363D;
    color: #8B949E;
    padding: 3px 9px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 10px;
    font-family: inherit;
    transition: all 0.2s;
  }
  .btn-scenario:hover  { border-color: #D29922; color: #D29922; }
  .btn-scenario:active { background: #3A2E1C; }

  /* Legend */
  #legend {
    display: flex;
    gap: 14px;
    padding: 6px 20px;
    background: #161B22;
    border-top: 1px solid #21262D;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    color: #8B949E;
  }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 1.5px solid;
  }
  .ld-healthy  { background: #1C3A2A; border-color: #3FB950; }
  .ld-drift    { background: #3A2E1C; border-color: #D29922; }
  .ld-error    { background: #3A1C1C; border-color: #F85149; }
  .ld-missing  { background: #1C1C2A; border-color: #58A6FF; }
  .ld-rootcause{ background: #1C1040; border-color: #BF5AF2; }

  .empty-state {
    color: #484F58;
    font-size: 11px;
    text-align: center;
    padding: 20px 0;
  }
</style>
</head>
<body>

<!-- Header -->
<div id="header">
  <div>
    <h1>Behavioral Baseline — Live Topology</h1>
    <div class="meta" id="env-label">connecting...</div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <button id="btn-clear" class="btn" onclick="clearAnomalies()" title="Clear alerts (keyboard: C)">Clear alerts [C]</button>
    <div id="status-badge" class="status-ok">● STEADY STATE</div>
  </div>
</div>

<!-- Main -->
<div id="main">

  <!-- Graph -->
  <div id="graph-container">
    <svg id="graph">
      <defs>
        <marker id="arrow-normal" viewBox="0 -4 8 8" refX="8" refY="0"
                markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0,-4L8,0L0,4" fill="#4A5568"/>
        </marker>
        <marker id="arrow-affected" viewBox="0 -4 8 8" refX="8" refY="0"
                markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0,-4L8,0L0,4" fill="#F85149"/>
        </marker>
        <marker id="arrow-chain" viewBox="0 -4 8 8" refX="8" refY="0"
                markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0,-4L8,0L0,4" fill="#BF5AF2"/>
        </marker>
        <marker id="arrow-new" viewBox="0 -4 8 8" refX="8" refY="0"
                markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0,-4L8,0L0,4" fill="#D29922"/>
        </marker>
      </defs>
      <g id="links-layer"></g>
      <g id="nodes-layer"></g>
    </svg>
  </div>

  <!-- Side panel -->
  <div id="panel">
    <div id="panel-header" style="display:flex;justify-content:space-between;align-items:center;">
      <span>Incident Details</span>
    </div>
    <div id="panel-content">
      <div class="empty-state" id="panel-empty">
        No anomalies detected.<br>Kill a service to see live highlighting.
      </div>
      <div id="panel-causality" class="panel-section" style="display:none">
        <h3>Causality Chain</h3>
        <div class="chain-container" id="chain-display"></div>
      </div>
      <div id="panel-affected" class="panel-section" style="display:none">
        <h3>Affected Services</h3>
        <div id="affected-list"></div>
      </div>
    </div>
    <div id="event-log">
      <div class="log-header">Live Event Stream</div>
      <div id="log-entries"></div>
    </div>
  </div>

</div>

<!-- Legend -->
<div id="legend">
  <div class="legend-item"><div class="legend-dot ld-healthy"></div> Healthy</div>
  <div class="legend-item"><div class="legend-dot ld-drift"></div> Trace drift</div>
  <div class="legend-item"><div class="legend-dot ld-error"></div> Error signature</div>
  <div class="legend-item"><div class="legend-dot ld-missing" style="border-style:dashed"></div> Missing</div>
  <div class="legend-item"><div class="legend-dot ld-rootcause"></div> Root cause ★</div>
  <div class="legend-item"><div class="legend-dot ld-drift" style="border-style:dashed"></div> New (unseen)</div>
</div>

<!-- Demo scenario bar (test-only) -->
<div id="demo-bar">
  <span class="demo-label">Simulate →</span>
  <button class="btn-scenario" onclick="runScenario('kill-service')"   title="vets-service killed — goes missing from traces">1 Kill service</button>
  <button class="btn-scenario" onclick="runScenario('new-call-path')"  title="visits-service starts calling a new downstream service">2 New call path</button>
  <button class="btn-scenario" onclick="runScenario('new-error')"      title="pets-service throws a new error signature">3 New error sig</button>
  <button class="btn-scenario" onclick="runScenario('db-dropped')"     title="visits-service stops calling mysql:petclinic — DB gone silent">4 DB gone silent</button>
  <button class="btn-scenario" onclick="runScenario('db-incident')"    title="DB down — multiple services get JDBC errors simultaneously">5 DB incident (multi)</button>
  <button class="btn-scenario" onclick="runScenario('cascading')"      title="vets-service killed → api-gateway errors → customers-service times out (2s apart)">6 Cascading failure</button>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let topology   = { nodes: [], edges: [] };
let active     = {};          // service -> [anomaly, ...]
let rootCause  = null;
let causalityChain = [];
let simulation = null;
let nodeMap    = {};          // id -> d3 node datum
let linkMap    = {};          // "src->dst" -> d3 link datum
let rScale     = () => 18;   // node radius fn — updated in renderGraph()
let newNodes   = [];          // [{id, label}] — nodes seen in drift events, not in baseline
let newEdges   = [];          // [{source, target, label}] — edges seen in drift events

// ── D3 Setup ──────────────────────────────────────────────────────────────
const svg    = d3.select("#graph");
const linksG = d3.select("#links-layer");
const nodesG = d3.select("#nodes-layer");

function getSize() {
  const el = document.getElementById("graph-container");
  return { w: el.clientWidth, h: el.clientHeight };
}

// ── Topology fetch & render ───────────────────────────────────────────────
async function loadTopology() {
  const res  = await fetch("/api/topology");
  const data = await res.json();
  topology   = data;
  active     = data.active || {};
  newNodes   = data.new_nodes || [];
  newEdges   = data.new_edges || [];
  document.getElementById("env-label").textContent =
    `env: ${data.environment}  |  ${data.nodes.length} services  |  ${data.edges.length} edges`;
  renderGraph();
  updatePanel();
}

function nodeState(id) {
  const anoms = active[id] || [];
  if (!anoms.length) {
    if (newNodes.some(n => n.id === id)) return "new";
    return "healthy";
  }
  const types = new Set(anoms.map(a => a.anomaly_type));
  // Determine base state from anomaly type
  let base = "drift";
  if (types.has("MISSING_SERVICE"))     base = "missing";
  if (types.has("NEW_ERROR_SIGNATURE")) base = "error";
  // Only show rootcause style when there are multiple affected services —
  // a single isolated anomaly doesn't need the root cause callout.
  const multiService = causalityChain.length > 1
    || Object.values(active).filter(v => v.length > 0).length > 1;
  if (id === rootCause && multiService) return "rootcause";
  return base;
}

function edgeState(src, dst) {
  // In causality chain path?
  const idx = causalityChain.indexOf(src);
  if (idx >= 0 && causalityChain[idx + 1] === dst) return "chain";
  // Both endpoints affected → propagation path
  const srcAffected = (active[src] || []).length > 0 || src === rootCause;
  const dstAffected = (active[dst] || []).length > 0 || dst === rootCause;
  if (srcAffected && dstAffected) return "affected";
  return "normal";
}

function renderGraph() {
  const { w, h } = getSize();

  // Node radius scaled by traffic — log scale + hard cap so high-traffic nodes
  // (e.g. api-gateway, mysql:petclinic) don't dominate the layout.
  // New (unseen) nodes get a fixed small radius since they have no traffic data.
  const maxTraffic = Math.max(...topology.nodes.map(n => n.traffic), 1);
  rScale = d => d.traffic !== undefined
    ? Math.min(30, 14 + Math.log1p(d.traffic) / Math.log1p(maxTraffic) * 16)
    : 16; // fixed size for new/unseen nodes

  // Merge new nodes into topology for simulation (tagged with _isNew)
  const allNodes = [
    ...topology.nodes,
    ...newNodes
      .filter(n => !topology.nodes.some(e => e.id === n.id))
      .map(n => {
        // Seed position near the source node of the first new edge that targets this node,
        // so the link force can pull them together instead of starting from (0,0).
        const srcEdge = newEdges.find(e => e.target === n.id);
        const srcNode = srcEdge ? nodeMap[srcEdge.source] || nodeMap[
          (typeof srcEdge.source === "object" ? srcEdge.source.id : srcEdge.source)
        ] : null;
        return {
          id: n.id,
          traffic: undefined,
          _isNew: true,
          x: srcNode?.x != null ? srcNode.x + (Math.random() - 0.5) * 80 : undefined,
          y: srcNode?.y != null ? srcNode.y + (Math.random() - 0.5) * 80 : undefined,
        };
      }),
  ];
  const allEdges = [
    ...topology.edges,
    ...newEdges
      .filter(e => !topology.edges.some(x =>
        `${x.source}->${x.target}` === `${e.source}->${e.target}`))
      .map(e => ({ ...e, _isNew: true, weight: 0 })),
  ];

  // Build maps
  nodeMap = {};
  allNodes.forEach(n => { nodeMap[n.id] = n; });

  // Links
  const links = linksG.selectAll(".link")
    .data(allEdges, d => {
      const s = typeof d.source === "object" ? d.source.id : d.source;
      const t = typeof d.target === "object" ? d.target.id : d.target;
      return `${s}->${t}`;
    });

  links.enter().append("line")
    .attr("class", d => d._isNew ? "link link-new" : `link link-${edgeState(d.source, d.target)}`)
    .each(function(d) {
      const label = d._isNew ? `NEW: ${d.source} → ${d.target}` : `${d.source} → ${d.target}\nweight: ${d.weight}`;
      d3.select(this).append("title").text(label);
    })
    .merge(links)
    .attr("class", d => d._isNew ? "link link-new" : `link link-${edgeState(d.source?.id || d.source, d.target?.id || d.target)}`);

  links.exit().remove();

  // Nodes
  const nodes = nodesG.selectAll(".node")
    .data(allNodes, d => d.id);

  const nodeEnter = nodes.enter().append("g")
    .attr("class", d => `node node-${nodeState(d.id)}`)
    .call(d3.drag()
      .on("start", dragStart)
      .on("drag",  dragged)
      .on("end",   dragEnd));

  nodeEnter.append("circle")
    .attr("r", d => rScale(d));

  // Pulse ring
  nodeEnter.append("circle")
    .attr("class", "pulse-ring")
    .attr("r", d => rScale(d) + 4);

  // Label background + text
  nodeEnter.append("rect").attr("class", "label-bg");
  nodeEnter.append("text").attr("dy", d => rScale(d) + 14);

  // Merge
  const nodeAll = nodeEnter.merge(nodes);

  nodeAll.attr("class", d => `node node-${nodeState(d.id)}`);
  nodeAll.select("circle:first-of-type").attr("r", d => rScale(d));
  nodeAll.select("text").text(d => d.id);

  // Size label bg after text renders
  nodeAll.each(function(d) {
    const g    = d3.select(this);
    const txt  = g.select("text").node();
    if (!txt) return;
    const bb   = txt.getBBox();
    const r    = rScale(d);
    g.select("rect.label-bg")
      .attr("x",      bb.x - 3)
      .attr("y",      r + 6)
      .attr("width",  bb.width + 6)
      .attr("height", bb.height + 2);
  });

  nodes.exit().remove();

  // Force simulation
  if (!simulation) {
    simulation = d3.forceSimulation()
      .force("link",    d3.forceLink().id(d => d.id).distance(150).strength(0.4))
      .force("charge",  d3.forceManyBody().strength(-600))
      .force("center",  d3.forceCenter(w / 2, h / 2))
      .force("collide", d3.forceCollide(d => rScale(d) + 32).strength(0.9))
      .on("tick", ticked);
  }

  const hasNewThisRender = newNodes.length > 0;
  simulation.nodes(allNodes);
  simulation.force("link").links(allEdges);
  simulation.alpha(hasNewThisRender ? 0.8 : 0.3).restart();
}

function ticked() {
  linksG.selectAll(".link").each(function(d) {
    // After simulation runs, d.source/d.target are mutated to node objects.
    // Before that (first render), they may still be string IDs — handle both.
    const src = (typeof d.source === "object" ? d.source : null)
             || nodeMap[d.source] || {};
    const tgt = (typeof d.target === "object" ? d.target : null)
             || nodeMap[d.target] || {};
    const x1 = src.x || 0, y1 = src.y || 0;
    const x2 = tgt.x || 0, y2 = tgt.y || 0;
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.sqrt(dx * dx + dy * dy) || 1;
    const r1 = rScale(src);
    const r2 = rScale(tgt) + 4; // +4 for arrowhead clearance
    d3.select(this)
      .attr("x1", x1 + dx / len * r1)
      .attr("y1", y1 + dy / len * r1)
      .attr("x2", x2 - dx / len * r2)
      .attr("y2", y2 - dy / len * r2);
  });

  nodesG.selectAll(".node")
    .attr("transform", d => `translate(${d.x || 0},${d.y || 0})`);
}

function dragStart(event, d) {
  if (!event.active) simulation.alphaTarget(0.3).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragged(event, d)   { d.fx = event.x; d.fy = event.y; }
function dragEnd(event, d) {
  if (!event.active) simulation.alphaTarget(0);
  d.fx = null; d.fy = null;
}

// ── State update ──────────────────────────────────────────────────────────
function updateBadge() {
  const anyActive = Object.values(active).some(v => v.length > 0);
  const badge = document.getElementById("status-badge");
  if (!anyActive) {
    badge.className = "status-badge status-ok";
    badge.textContent = "● STEADY STATE";
  } else {
    const allAnoms = Object.values(active).flat();
    const hasError   = allAnoms.some(a => a.anomaly_type === "NEW_ERROR_SIGNATURE");
    const hasMissing = allAnoms.some(a => a.anomaly_type === "MISSING_SERVICE");
    if (hasError || hasMissing) {
      badge.className = "status-badge status-error";
      badge.textContent = "● INCIDENT DETECTED";
    } else {
      badge.className = "status-badge status-warning";
      badge.textContent = "⚠ DRIFT DETECTED";
    }
  }
}

function applyState(newActive, chain, incomingNewNodes, incomingNewEdges) {
  active = newActive || {};
  causalityChain = chain || [];
  rootCause = causalityChain.length ? causalityChain[0] : null;

  // If new nodes/edges arrived, re-render the graph to include them
  const hadNew = newNodes.length > 0 || newEdges.length > 0;
  if (incomingNewNodes !== undefined) newNodes = incomingNewNodes;
  if (incomingNewEdges !== undefined) newEdges = incomingNewEdges;
  const hasNew = newNodes.length > 0 || newEdges.length > 0;
  if (hasNew !== hadNew || incomingNewNodes?.length || incomingNewEdges?.length) {
    renderGraph();
    // renderGraph re-binds data but doesn't re-apply anomaly classes to existing nodes
    nodesG.selectAll(".node").attr("class", d => `node node-${nodeState(d.id)}`);
    linksG.selectAll(".link").attr("class", d => {
      if (d._isNew) return "link link-new";
      const src = typeof d.source === "object" ? d.source.id : d.source;
      const dst = typeof d.target === "object" ? d.target.id : d.target;
      return `link link-${edgeState(src, dst)}`;
    });
    updatePanel();
    updateBadge();
    return;
  }

  // Update node classes
  nodesG.selectAll(".node")
    .attr("class", d => `node node-${nodeState(d.id)}`);

  // Update edge classes
  linksG.selectAll(".link")
    .attr("class", d => {
      const src = typeof d.source === "object" ? d.source.id : d.source;
      const dst = typeof d.target === "object" ? d.target.id : d.target;
      return `link link-${edgeState(src, dst)}`;
    });

  updateBadge();

  updatePanel();
}

function updatePanel() {
  const anyActive = Object.values(active).some(v => v.length > 0);
  document.getElementById("panel-empty").style.display     = anyActive ? "none" : "block";
  document.getElementById("panel-causality").style.display = anyActive && causalityChain.length ? "block" : "none";
  document.getElementById("panel-affected").style.display  = anyActive ? "block" : "none";

  // Causality chain
  if (causalityChain.length) {
    const chainEl = document.getElementById("chain-display");
    chainEl.innerHTML = causalityChain.map((svc, i) => {
      const isRoot = i === 0;
      const arrow  = i < causalityChain.length - 1
        ? `<span class="chain-arrow">→</span>` : "";
      return `<div class="chain-item">
        <span class="${isRoot ? 'chain-root' : 'chain-svc'}">${svc}</span>
        ${isRoot ? '<span class="chain-label">ROOT CAUSE</span>' : ''}
        ${arrow}
      </div>`;
    }).join("");
  }

  // Affected services list — include synthetic root cause node (e.g. mysql:petclinic)
  // even if it has no own anomaly events (it's inferred from causality traversal).
  const listEl = document.getElementById("affected-list");
  const affectedEntries = Object.entries(active).filter(([, v]) => v.length > 0);
  // Prepend root cause if it's synthetic (not in active map)
  if (rootCause && !active[rootCause]?.length) {
    affectedEntries.unshift([rootCause, []]);
  }
  const affected = affectedEntries;
  if (!affected.length) { listEl.innerHTML = ""; return; }

  listEl.innerHTML = affected.map(([svc, anoms]) => {
    const state  = nodeState(svc);
    const badgeClass = {
      rootcause: "badge-rootcause", error: "badge-error",
      missing:   "badge-missing",   drift: "badge-drift"
    }[state] || "badge-drift";
    const label = {
      rootcause: "ROOT CAUSE ★", error: "ERROR", missing: "MISSING", drift: "DRIFT"
    }[state] || "DRIFT";

    const anomItems = anoms.map(a => {
      const ts = new Date(a.timestamp_ms).toLocaleTimeString();
      return `<div class="anomaly-item">
        <span class="ts">${ts}</span> ${a.message || a.anomaly_type}
      </div>`;
    }).join("");

    return `<div class="service-card state-${state}">
      <div class="svc-name">${svc} <span class="badge ${badgeClass}">${label}</span></div>
      ${anomItems}
    </div>`;
  }).join("");
}

// ── Event log ─────────────────────────────────────────────────────────────
function addLogEntry(event) {
  const logEl = document.getElementById("log-entries");
  const atype = event.anomaly_type || "";
  const ts    = new Date(event.timestamp_ms || Date.now()).toLocaleTimeString();
  const cls   = atype === "NEW_ERROR_SIGNATURE" ? "log-type-error"
              : atype === "MISSING_SERVICE"     ? "log-type-missing"
              : "log-type-drift";
  const label = atype === "NEW_ERROR_SIGNATURE" ? "error.signature.drift"
              : atype === "MISSING_SERVICE"     ? "trace.path.drift (MISSING)"
              : "trace.path.drift";

  // For MISSING_SERVICE show "caller → missing_svc"; for others just service name
  let svcDisplay = event.service || "";
  if (atype === "MISSING_SERVICE" && event.missing_services && event.missing_services.length) {
    const caller = (event.root_op || "").split(":")[0];
    svcDisplay = caller ? `${caller} → ${event.missing_services.join(", ")}` : event.missing_services.join(", ");
  }

  const entry = document.createElement("div");
  entry.className = "log-entry";
  entry.innerHTML = `<span class="log-ts">${ts}</span> `
    + `<span class="${cls}">${label}</span> `
    + `<span class="log-svc">${svcDisplay}</span>`;
  logEl.prepend(entry);

  // Keep last 50 entries
  while (logEl.children.length > 50) logEl.removeChild(logEl.lastChild);
}

// ── SSE ───────────────────────────────────────────────────────────────────
function connectSSE() {
  const es = new EventSource("/api/events");
  es.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === "drift") {
      addLogEntry(msg.event);
      applyState(msg.active, msg.causality_chain, msg.new_nodes, msg.new_edges);
    } else if (msg.type === "state") {
      applyState(msg.active, causalityChain, msg.new_nodes, msg.new_edges);
    } else if (msg.type === "recovered") {
      applyState({}, [], [], []);
      flashRecovery(msg.message);
    }
  };
  es.onerror = () => {
    console.warn("SSE disconnected — reconnecting in 3s");
    setTimeout(connectSSE, 3000);
  };
}

// ── Clear ─────────────────────────────────────────────────────────────────
function flashRecovery(message) {
  // Brief green flash on all nodes + log entry to signal recovery
  nodesG.selectAll(".node circle:first-of-type")
    .style("filter", "drop-shadow(0 0 10px #3FB950)")
    .transition().duration(2000)
    .style("filter", null);

  const logEl = document.getElementById("log-entries");
  const entry = document.createElement("div");
  entry.className = "log-entry";
  entry.style.color = "#3FB950";
  entry.innerHTML = `<span class="log-ts">${new Date().toLocaleTimeString()}</span> `
    + `<span style="color:#3FB950">● RECOVERED</span> — ${message || "all services healthy"}`;
  logEl.prepend(entry);

  const badge = document.getElementById("status-badge");
  badge.className = "status-badge status-ok";
  badge.textContent = "● STEADY STATE";
}

async function clearAnomalies() {
  await fetch("/api/clear");
  active = {};
  causalityChain = [];
  rootCause = null;
  newNodes = [];
  newEdges = [];
  renderGraph();
  updatePanel();
  document.getElementById("log-entries").innerHTML = "";
}

// ── Demo scenarios ────────────────────────────────────────────────────────
async function runScenario(name) {
  const res = await fetch(`/api/demo/${name}`);
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    console.error("Demo scenario failed:", err);
  }
}

// ── Keyboard shortcuts ────────────────────────────────────────────────────
document.addEventListener("keydown", (e) => {
  if (e.key === "c" || e.key === "C") {
    // Only fire if not typing in an input
    if (document.activeElement.tagName !== "INPUT" &&
        document.activeElement.tagName !== "TEXTAREA") {
      clearAnomalies();
    }
  }
});

// ── Resize ────────────────────────────────────────────────────────────────
window.addEventListener("resize", () => {
  if (!simulation) return;
  const { w, h } = getSize();
  simulation.force("center", d3.forceCenter(w / 2, h / 2));
  simulation.alpha(0.1).restart();
});

// ── Init ──────────────────────────────────────────────────────────────────
loadTopology().then(() => connectSSE());
</script>
