# astro-values.yaml — Helm values for opentelemetry-demo (Astronomy Shop)
#
# Routes all app traces through otelcol-fingerprint by setting
# OTEL_EXPORTER_OTLP_ENDPOINT and OTEL_COLLECTOR_HOST on each component at
# install time.  Pass this file when installing / upgrading the chart:
#
#   helm install astronomy-shop open-telemetry/opentelemetry-demo \
#     --version 0.40.8 \
#     -f otel-processor/k8s/astro-values.yaml
#
# After install, NO kubectl set env patching is needed.  deploy.sh Step 4
# will still run but will find all deployments already configured (no-ops).
#
# OTEL_SERVICE_NAME is set per-component so nginx/Python services that
# require it explicitly don't crash on startup.
#
# Update FP_GRPC / FP_HOST if you change the DaemonSet service name.
#
# NOTE: Component keys must match the chart's schema (kebab-case with hyphens).

# ── Component overrides ───────────────────────────────────────────────────────
components:
  accounting:
    envOverrides:
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "http://otelcol-fingerprint.default.svc.cluster.local:4317"
      - name: OTEL_COLLECTOR_HOST
        value: "otelcol-fingerprint.default.svc.cluster.local"
      - name: OTEL_SERVICE_NAME
        value: accounting

