      - name: OTEL_SERVICE_NAME
        value: cart
      # .NET runtime metrics: dotnet.gc.collections, dotnet.exceptions, dotnet.thread_pool.*
      - name: OTEL_METRICS_EXPORTER
        value: otlp
      - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
