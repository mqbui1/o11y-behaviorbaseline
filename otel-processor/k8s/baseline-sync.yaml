# baseline-learn CronJob
# ========================
# Runs trace_fingerprint.py learn + promote inside the cluster on a schedule,
# then pushes the result into the behavioral-baseline ConfigMap and injects it
# directly into each otelcol-fingerprint pod via kubectl cp.
#
# Uses workshop-secret for Splunk API credentials (already present on cluster).
# Uses the baseline-sync ServiceAccount for ConfigMap + pod exec permissions.
#
# Schedule: nightly at 2am UTC. Adjust spec.schedule as needed.
#
# Trigger manually (e.g. after a deploy):
#   kubectl create job --from=cronjob/baseline-learn baseline-learn-manual
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: baseline-learn
  namespace: default
spec:
  schedule: "0 2 * * *"        # nightly at 2am UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: baseline-sync
          restartPolicy: OnFailure
          initContainers:
            # Clone repo to get trace_fingerprint.py
            - name: git-sync
              image: alpine/git:latest
              command:
                - sh
                - -c
                - |
                  if [ -d /repo/.git ]; then
                    git -C /repo pull --ff-only
                  else
                    git clone https://github.com/mqbui1/o11y-behaviorbaseline.git /repo
                  fi
                  echo "Repo ready: $(ls /repo/core/)"
              volumeMounts:
                - name: workspace
                  mountPath: /repo
          containers:
            - name: learn
              # python:3.11-slim + kubectl installed via curl
              image: python:3.11-slim
              env:
                - name: SPLUNK_ACCESS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: workshop-secret
                      key: api_token
                - name: SPLUNK_REALM
                  valueFrom:
                    secretKeyRef:
                      name: workshop-secret
                      key: realm
                - name: ENVIRONMENT
                  valueFrom:
                    secretKeyRef:
                      name: workshop-secret
                      key: env
              command:
                - sh
                - -c
                - |
                  set -e

                  # Install kubectl
                  echo "[baseline-learn] Installing kubectl + deps..."
                  apt-get update -qq && apt-get install -y -qq curl ca-certificates
                  curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
                  chmod +x kubectl && mv kubectl /usr/local/bin/
                  pip install requests python-dotenv --quiet

                  cd /repo
                  echo "[baseline-learn] Learning for: $ENVIRONMENT (last 60 min)..."
                  python3 core/trace_fingerprint.py \
                    --environment "$ENVIRONMENT" \
                    learn --window-minutes 60

                  echo "[baseline-learn] Promoting..."
                  python3 core/trace_fingerprint.py \
                    --environment "$ENVIRONMENT" \
                    promote

                  BASELINE="data/baseline.${ENVIRONMENT}.json"
                  FP_COUNT=$(python3 -c "import json; d=json.load(open('$BASELINE')); print(len(d['fingerprints']))")
                  echo "[baseline-learn] $FP_COUNT fingerprints learned"

                  echo "[baseline-learn] Updating ConfigMap..."
                  kubectl delete configmap behavioral-baseline --ignore-not-found
                  kubectl create configmap behavioral-baseline \
                    --from-file=baseline.json="$BASELINE"

                  echo "[baseline-learn] Injecting into pods..."
                  for pod in $(kubectl get pods -l app=otelcol-fingerprint \
                      --field-selector=status.phase=Running \
                      -o jsonpath='{.items[*].metadata.name}'); do
                    kubectl cp "$BASELINE" "$pod:/baseline/baseline.json" -c otelcol \
                      && echo "  $pod: ok" \
                      || echo "  $pod: skipped"
                  done

                  echo "[baseline-learn] Done. $FP_COUNT fingerprints active."
              volumeMounts:
                - name: workspace
                  mountPath: /repo
          volumes:
            - name: workspace
              emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: baseline-sync
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: baseline-sync
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: baseline-sync
  namespace: default
subjects:
  - kind: ServiceAccount
    name: baseline-sync
roleRef:
  kind: Role
  name: baseline-sync
  apiGroup: rbac.authorization.k8s.io
