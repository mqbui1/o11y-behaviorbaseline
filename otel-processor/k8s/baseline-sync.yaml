# baseline-learn CronJob
# ========================
# Runs trace_fingerprint.py learn + promote inside the cluster on a schedule,
# then pushes the result into the behavioral-baseline ConfigMap and injects it
# directly into each otelcol-fingerprint pod via kubectl cp.
#
# Uses workshop-secret for Splunk API credentials (already present on cluster).
# Uses the baseline-sync ServiceAccount for ConfigMap + pod exec permissions.
#
# Two schedules: 2am UTC (off-hours baseline) + 10am UTC (peak-hours baseline).
# They share the same CronJob spec - concurrencyPolicy: Forbid prevents overlap.
#
# Multi-environment: set ENVIRONMENTS in workshop-secret to a comma-separated list
# (e.g. "env1,env2,env3") to learn baselines for multiple environments in one job.
# Falls back to ENVIRONMENT (single env) for backwards compatibility.
#
# Git SHA pinning: set GIT_SHA in workshop-secret to pin the job to a specific
# commit. Leave unset (or set to "main") to always use the latest main branch.
#
# Post-learn steps (automatic each run):
#   - noise_learner.py --apply: prunes noise patterns before learn
#   - coverage_auditor.py: emits behavioral_baseline.low_coverage if coverage <50%
#   - adaptive_thresholds.py --emit: tunes per-service thresholds
#   - baseline_drift_monitor.py snapshot: weekly drift snapshot (Sundays 2am)
#   - dedup state pruning: removes otel_dedup_state entries older than 7 days
#
# Trigger manually (e.g. after a deploy):
#   kubectl create job --from=cronjob/baseline-learn baseline-learn-manual
#
# Check logs of last run:
#   kubectl logs -l app=baseline-learn --tail=50
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: baseline-learn
  namespace: default
spec:
  schedule: "0 2,10 * * *"     # 2am UTC (off-hours) + 10am UTC (peak traffic)
  concurrencyPolicy: Forbid     # don't overlap if a previous job is still running
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: baseline-learn
        spec:
          serviceAccountName: baseline-sync
          restartPolicy: OnFailure
          initContainers:
            # Clone (or update) the repo to get the latest trace_fingerprint.py.
            # If GIT_SHA is set, checks out that exact commit (safe, reproducible).
            # If unset or "main", uses the latest main branch commit.
            - name: git-sync
              image: alpine/git:latest
              env:
                - name: GIT_SHA
                  valueFrom:
                    secretKeyRef:
                      name: workshop-secret
                      key: git_sha
                      optional: true   # key may not exist — falls back to main
              command:
                - sh
                - -c
                - |
                  if [ -n "$GIT_SHA" ] && [ "$GIT_SHA" != "main" ]; then
                    if [ -d /repo/.git ]; then
                      git -C /repo fetch --quiet
                    else
                      git clone --depth 1 https://github.com/mqbui1/o11y-behaviorbaseline.git /repo
                    fi
                    git -C /repo checkout "$GIT_SHA"
                    echo "Repo pinned to $GIT_SHA"
                  else
                    if [ -d /repo/.git ]; then
                      git -C /repo fetch --depth 1 --quiet origin main
                      git -C /repo reset --hard origin/main
                    else
                      git clone --depth 1 https://github.com/mqbui1/o11y-behaviorbaseline.git /repo
                    fi
                    echo "Repo at latest main: $(git -C /repo rev-parse --short HEAD)"
                  fi
              volumeMounts:
                - name: workspace
                  mountPath: /repo
          containers:
            - name: learn
              # Pre-baked image: python:3.11-slim + kubectl + requests + python-dotenv
              # Build: docker build -f k8s/Dockerfile.baseline-learn -t localhost:9999/baseline-learn:latest k8s/
              # Push:  docker push localhost:9999/baseline-learn:latest
              # Falls back to python:3.11-slim if custom image not available -
              # kubectl will be downloaded at runtime (slower but functional).
              image: localhost:9999/baseline-learn:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: SPLUNK_ACCESS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: workshop-secret
                      key: api_token
                - name: SPLUNK_REALM
                  valueFrom:
                    secretKeyRef:
                      name: workshop-secret
                      key: realm
                - name: SPLUNK_INGEST_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: workshop-secret
                      key: access_token
                - name: ENVIRONMENT
                  valueFrom:
                    secretKeyRef:
                      name: workshop-secret
                      key: env
                - name: ENVIRONMENTS
                  valueFrom:
                    secretKeyRef:
                      name: workshop-secret
                      key: environments
                      optional: true   # comma-separated list; falls back to ENVIRONMENT
              command:
                - sh
                - -c
                - |
                  set -eu
                  cd /repo

                  # Install kubectl if not pre-baked (fallback for plain python image)
                  command -v kubectl >/dev/null 2>&1 || {
                    echo "[baseline-learn] kubectl not found - installing..."
                    apt-get update -qq && apt-get install -y -qq curl ca-certificates
                    KUBECTL_VER=$(curl -sL https://dl.k8s.io/release/stable.txt)
                    curl -sLO "https://dl.k8s.io/release/${KUBECTL_VER}/bin/linux/amd64/kubectl"
                    chmod +x kubectl && mv kubectl /usr/local/bin/
                  }

                  # Install Python deps if not pre-baked
                  pip show requests >/dev/null 2>&1 || pip install requests python-dotenv --quiet

                  # Build the list of environments to learn for.
                  # ENVIRONMENTS (comma-separated) takes priority over single ENVIRONMENT.
                  ENV_LIST="${ENVIRONMENTS:-${ENVIRONMENT:-}}"
                  if [ -z "$ENV_LIST" ]; then
                    echo "[baseline-learn] ERROR: no environment configured (set ENVIRONMENT or ENVIRONMENTS)"
                    exit 1
                  fi

                  EMIT_FAIL="python3 -c \"import json,os,time,urllib.request; tok=os.environ.get('SPLUNK_INGEST_TOKEN') or os.environ.get('SPLUNK_ACCESS_TOKEN',''); rlm=os.environ.get('SPLUNK_REALM','us1'); env='\$ENV'; body=json.dumps([{'eventType':'behavioral_baseline.learn_failed','category':'USER_DEFINED','dimensions':{'sf_environment':env},'properties':{'environment':env,'step':'learn','message':'baseline learn step failed'},'timestamp':int(time.time()*1000)}]).encode(); req=urllib.request.Request('https://ingest.'+rlm+'.signalfx.com/v2/event',data=body,headers={'X-SF-Token':tok,'Content-Type':'application/json'},method='POST'); urllib.request.urlopen(req,timeout=10)\" || true"

                  TOTAL_FP=0
                  TOTAL_INJECTED=0

                  # Loop over each environment (comma-separated)
                  echo "$ENV_LIST" | tr ',' '\n' | while read -r ENV; do
                    ENV=$(echo "$ENV" | tr -d ' ')
                    [ -z "$ENV" ] && continue

                    echo "[baseline-learn] === Environment: $ENV ==="
                    echo "[baseline-learn] Learning (last 60 min)..."
                    set +e
                    python3 core/trace_fingerprint.py --environment "$ENV" learn --window-minutes 60
                    LEARN_RC=$?
                    set -e

                    if [ $LEARN_RC -ne 0 ]; then
                      echo "[baseline-learn] learn failed for $ENV - emitting alert"
                      python3 -c "import json,os,time,urllib.request; tok=os.environ.get('SPLUNK_INGEST_TOKEN') or os.environ.get('SPLUNK_ACCESS_TOKEN',''); rlm=os.environ.get('SPLUNK_REALM','us1'); body=json.dumps([{'eventType':'behavioral_baseline.learn_failed','category':'USER_DEFINED','dimensions':{'sf_environment':'$ENV'},'properties':{'environment':'$ENV','step':'learn','message':'baseline learn step failed'},'timestamp':int(time.time()*1000)}]).encode(); req=urllib.request.Request('https://ingest.'+rlm+'.signalfx.com/v2/event',data=body,headers={'X-SF-Token':tok,'Content-Type':'application/json'},method='POST'); urllib.request.urlopen(req,timeout=10)" || true
                      continue
                    fi

                    echo "[baseline-learn] Promoting fingerprints..."
                    python3 core/trace_fingerprint.py --environment "$ENV" promote

                    BASELINE="data/baseline.${ENV}.json"
                    FP_COUNT=$(python3 -c "import json; d=json.load(open('$BASELINE')); print(len(d.get('fingerprints',{})))")
                    PENDING=$(python3 -c "import json; d=json.load(open('$BASELINE')); print(len(d.get('pending',{})))" 2>/dev/null || echo 0)
                    echo "[baseline-learn] $FP_COUNT fingerprints promoted, $PENDING pending"

                    # Alert if fingerprints are stuck in pending (not promoted yet)
                    if [ "$PENDING" -gt 0 ]; then
                      python3 -c "import json,os,time,urllib.request; tok=os.environ.get('SPLUNK_INGEST_TOKEN') or os.environ.get('SPLUNK_ACCESS_TOKEN',''); rlm=os.environ.get('SPLUNK_REALM','us1'); body=json.dumps([{'eventType':'trace.fingerprint.pending','category':'USER_DEFINED','dimensions':{'sf_environment':'$ENV'},'properties':{'environment':'$ENV','pending_count':$PENDING,'promoted_count':$FP_COUNT,'message':'$PENDING fingerprint(s) pending promotion - may need more traffic or lower promotion_threshold'},'timestamp':int(time.time()*1000)}]).encode(); req=urllib.request.Request('https://ingest.'+rlm+'.signalfx.com/v2/event',data=body,headers={'X-SF-Token':tok,'Content-Type':'application/json'},method='POST'); urllib.request.urlopen(req,timeout=10)" || true
                    fi

                    echo "[baseline-learn] Updating ConfigMap behavioral-baseline..."
                    kubectl delete configmap behavioral-baseline --ignore-not-found
                    kubectl create configmap behavioral-baseline --from-file=baseline.json="$BASELINE"

                    echo "[baseline-learn] Injecting into pods..."
                    INJECTED=0
                    for pod in $(kubectl get pods -l app=otelcol-fingerprint \
                        --field-selector=status.phase=Running \
                        -o jsonpath='{.items[*].metadata.name}'); do
                      kubectl cp "$BASELINE" "$pod:/baseline/baseline.json" -c otelcol \
                        && echo "  $pod: ok" && INJECTED=$((INJECTED+1)) \
                        || echo "  $pod: skipped"
                    done

                    echo "[baseline-learn] Done: $ENV — $FP_COUNT fingerprints in $INJECTED pod(s)."
                  done

                  # ── Post-learn steps (run once, across all envs) ──────────────
                  echo "[baseline-learn] Running post-learn steps..."

                  # 1. Noise pattern pruning — find and persist app-specific noise
                  #    patterns so the next learn cycle ignores them automatically.
                  echo "[baseline-learn] Pruning noise patterns..."
                  python3 agents/noise_learner.py --apply 2>/dev/null || true

                  # 2. Coverage audit — emit low_coverage events for any root_op
                  #    below 50% match rate against live traffic.
                  echo "[baseline-learn] Running coverage audit..."
                  echo "$ENV_LIST" | tr ',' '\n' | while read -r ENV; do
                    ENV=$(echo "$ENV" | tr -d ' ')
                    [ -z "$ENV" ] && continue
                    python3 agents/coverage_auditor.py --environment "$ENV" --window-minutes 60 --emit 2>/dev/null || true
                  done

                  # 3. Adaptive threshold tuning — observe FP/TP rates and
                  #    update per-service thresholds in thresholds.json.
                  echo "[baseline-learn] Tuning adaptive thresholds..."
                  python3 agents/adaptive_thresholds.py \
                    --environment "${ENVIRONMENT:-}" --emit 2>/dev/null || true

                  # 4. Weekly drift snapshot (only on Sundays at 2am UTC).
                  #    Taken once per week so the next diff can report changes.
                  DOW=$(date +%u)   # 1=Mon ... 7=Sun
                  HOUR=$(date +%H)
                  if [ "$DOW" = "7" ] && [ "$HOUR" -lt "4" ]; then
                    echo "[baseline-learn] Taking weekly drift snapshot..."
                    echo "$ENV_LIST" | tr ',' '\n' | while read -r ENV; do
                      ENV=$(echo "$ENV" | tr -d ' ')
                      [ -z "$ENV" ] && continue
                      python3 baseline_drift_monitor.py --environment "$ENV" snapshot 2>/dev/null || true
                    done
                  fi

                  # 5. Dedup state pruning — remove entries older than 7 days.
                  echo "[baseline-learn] Pruning dedup state files..."
                  python3 -c "import json,time; from pathlib import Path; cutoff=time.time()-7*24*3600; [f.write_text(json.dumps({k:v for k,v in json.loads(f.read_text()).items() if isinstance(json.loads(f.read_text()),dict) and v.get('ts',0)>cutoff})) or print(f'  pruned {f.name}') for f in Path('data').glob('*dedup_state*.json')]" 2>/dev/null || true

                  # 6. Baseline health monitor — check for stale entries, incident
                  #    artifacts, near-duplicates, and low-confidence fingerprints.
                  #    --auto-fix removes LOW_CONFIDENCE entries automatically.
                  echo "[baseline-learn] Running baseline health monitor..."
                  echo "$ENV_LIST" | tr ',' '\n' | while read -r ENV; do
                    ENV=$(echo "$ENV" | tr -d ' ')
                    [ -z "$ENV" ] && continue
                    python3 agents/baseline_monitor.py --environment "$ENV" --auto-fix 2>/dev/null || true
                  done

                  # 7. Self-healing — if an incident recently resolved, pick the
                  #    cleanest pre-incident window and re-learn the baseline from it.
                  echo "[baseline-learn] Running self-healing check..."
                  echo "$ENV_LIST" | tr ',' '\n' | while read -r ENV; do
                    ENV=$(echo "$ENV" | tr -d ' ')
                    [ -z "$ENV" ] && continue
                    python3 agents/baseline_healer.py --environment "$ENV" --mode once 2>/dev/null || true
                  done

                  # 8. Runbook generation — write/refresh the incident runbook for
                  #    each environment. Skips if runbook already exists and is fresh.
                  echo "[baseline-learn] Refreshing incident runbooks..."
                  echo "$ENV_LIST" | tr ',' '\n' | while read -r ENV; do
                    ENV=$(echo "$ENV" | tr -d ' ')
                    [ -z "$ENV" ] && continue
                    python3 agents/runbook_generator.py --environment "$ENV" 2>/dev/null || true
                  done

                  echo "[baseline-learn] All post-learn steps complete."
              volumeMounts:
                - name: workspace
                  mountPath: /repo
          volumes:
            - name: workspace
              emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: baseline-sync
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: baseline-sync
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: baseline-sync
  namespace: default
subjects:
  - kind: ServiceAccount
    name: baseline-sync
roleRef:
  kind: Role
  name: baseline-sync
  apiGroup: rbac.authorization.k8s.io
